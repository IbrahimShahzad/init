set-option -sa terminal-overrides ",xterm*:Tc"
bind -n M-H previous-window
bind -n M-L next-window

# start window numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on # renumber windows when a window is closed

# set-option default-terminal "screen-256color"
# set-option default-terminal "tmux-256color"
set -g mouse on
set -g mode-keys vi
set-option -g history-limit 10000 # set history limit to 10000

# set display-panes-time 2000
# display-message "Hello my tmux friends"
# set -g base-index 1
# setw -g pane-base-index 1
# set -g renumber-windows on
# set-option -a terminal-overrides ",XXX:RGB"
# set-option -a terminal-overrides ",*256col*:RGB"


# List of plugins
# Install plugins via TPM by running `prefix + I`
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "arcticicestudio/nord-tmux"

# set -g @plugin 'catppuccin/tmux'
